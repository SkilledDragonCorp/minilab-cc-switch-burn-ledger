name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Bun audit
        run: bun audit

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills

  upstream-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"

      - name: Upstream frontend (verbatim at pin)
        run: bash scripts/upstream-cc-switch-frontend.sh

  upstream-backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC_SWITCH_TEST_HOME: ${{ runner.temp }}/cc-home
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vendor cc-switch at pin
        run: bash scripts/vendor-cc-switch.sh

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        working-directory: vendor/cc-switch
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/cc-switch/src-tauri -> target
          shared-key: backend

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest

      - name: Upstream backend (verbatim at pin)
        run: bash scripts/upstream-cc-switch-backend.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Vendor cc-switch at pin
        run: bash scripts/vendor-cc-switch.sh

      - name: Install pinned osv-scanner
        run: |
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: osv-scanner on upstream lockfiles
        run: ./osv-scanner scan source --lockfile vendor/cc-switch/pnpm-lock.yaml --lockfile vendor/cc-switch/src-tauri/Cargo.lock

      - name: Install pinned gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks
        run: ./gitleaks git --redact --verbose .
